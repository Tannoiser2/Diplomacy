<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17100b">
<link rel="icon" href="b4.png">
<title>Diplomacy - la vostra cancelleria</title>
<!--
  Diplomacy sul telefono: la parte segreta del gioco (diplomazia e ordini) come semplice pagina di testo.
  La mappa resta sul tabellone, cioè sullo schermo di chi ospita la partita, che pubblica nel database
  lo stato e tutte le scelte possibili (labels/tel/…); questa pagina le mostra e rimanda indietro le
  azioni numerate (plans/<numero>/<posto>). Vedi scripts/net/telefoni.gd.
-->
<style>
@font-face { font-family: "Old Standard"; src: url("fonts/OldStandard-Regular.ttf"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Old Standard"; src: url("fonts/OldStandard-Bold.ttf"); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: "Old Standard"; src: url("fonts/OldStandard-Italic.ttf"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Pinyon"; src: url("fonts/PinyonScript-Regular.ttf"); font-display: swap; }
@font-face { font-family: "Telegrafo"; src: url("fonts/SpecialElite-Regular.ttf"); font-display: swap; }
:root {
  --fondo: #17100b; --pannello: #1f1611; --pannello-l: #33241a; --ottone: #c2a257; --ottone-l: #ecd693;
  --cera: #8e1b1b; --cera-l: #d24a3c; --testo: #efe6cf; --spento: #ad9f82; --verde: #9fd08a;
  --carta: #eadfc2; --inchiostro: #2b1d12; --inchiostro-l: #5a4630;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #2a1c12 0%, var(--fondo) 60%) fixed var(--fondo);
  color: var(--testo); font-family: "Old Standard", Georgia, "Times New Roman", serif; font-size: 17px; line-height: 1.3;
  overscroll-behavior: none; -webkit-text-size-adjust: 100%;
}
#app {
  max-width: 600px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
}
.pannello { background: var(--pannello); border: 1px solid var(--ottone); border-radius: 8px; padding: 10px 12px; }
#testa { display: flex; align-items: center; gap: 12px; min-height: 62px; }
#testa img { height: 40px; border-radius: 2px; box-shadow: 0 0 0 1px #0008; }
#testa .t { font-weight: 700; font-size: 24px; color: var(--ottone-l); line-height: 1.05; }
#testa .s { font-style: italic; color: var(--spento); font-size: 15px; }
#schede { display: none; gap: 6px; }
#schede button { flex: 1; min-height: 50px; padding: 4px 2px; font-size: 15.5px; white-space: nowrap; }
#schede button:first-child { flex: 1.35; }
#schede button.su { background: #5a241c; border-color: var(--ottone-l); color: #fff3d0; }
#corpo { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 8px; }
#corpo > * { flex-shrink: 0; }
#scheda > * { flex-shrink: 0; }
#piede { font-style: italic; color: var(--spento); font-size: 15px; min-height: 22px; padding: 0 4px; }
h2 { font-size: 21px; margin: 2px 0 0; color: var(--ottone-l); font-weight: 700; }
h3 { font-size: 18px; margin: 8px 0 0; color: var(--ottone-l); font-weight: 700; }
p { margin: 0; }
.nota { font-style: italic; color: var(--spento); font-size: 15.5px; }
.avviso { color: var(--cera-l); }
.bene { color: var(--verde); }
button {
  font: inherit; font-weight: 700; color: var(--ottone-l); background: var(--pannello-l); border: 1.5px solid var(--ottone);
  border-radius: 6px; min-height: 54px; padding: 8px 14px; width: 100%; text-align: center; cursor: pointer; letter-spacing: .2px;
}
button:active { filter: brightness(1.25); }
button.sx { text-align: left; }
button.primo { background: var(--cera); border-color: var(--ottone-l); color: #fff0d2; }
button.acceso { color: #fff; }
button.rosso { color: var(--cera-l); }
button:disabled { opacity: .45; }
.fila { display: flex; gap: 8px; }
.griglia { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.fondo { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.riga { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; min-height: 78px; padding: 8px 10px; border-width: 1px; border-color: #c2a25788; }
.riga img { height: 30px; flex: none; border-radius: 2px; }
.riga .n { color: #fff; font-size: 17.5px; }
.riga .d { font-weight: 400; font-size: 15px; color: var(--spento); }
.riga.posta { border: 2.5px solid var(--cera-l); }
.riga.posta .d { color: var(--cera-l); }
.riga.patto { border: 2.5px solid #5fae5f; }
.riga.patto .d { color: #8fd08f; }
.riga.morta { opacity: .4; }
.foglio {
  background: var(--carta) url("pergamena.jpg") center/cover; color: var(--inchiostro); border-radius: 3px; padding: 10px 12px;
  box-shadow: 0 1px 4px #000a; display: flex; flex-direction: column; gap: 6px;
}
.foglio.mio { margin-left: 26px; filter: saturate(.85) brightness(.96); }
.foglio:not(.mio) { margin-right: 26px; }
.foglio .h { font-weight: 700; font-size: 12.5px; letter-spacing: .6px; color: var(--inchiostro-l); }
.foglio .x { font-family: "Telegrafo", "Courier New", monospace; font-size: 16.5px; line-height: 1.28; white-space: pre-wrap; overflow-wrap: anywhere; }
.foglio .e { font-weight: 700; font-size: 13px; letter-spacing: .6px; color: var(--inchiostro-l); }
.foglio .e.ok { color: #2c6a2c; } .foglio .e.no { color: var(--cera); }
.foglio button { min-height: 46px; background: #2b1d12; }
.foglio button.primo { background: var(--cera); }
.pot { display: flex; gap: 8px; align-items: flex-start; }
.pot img { height: 20px; margin-top: 3px; flex: none; }
.pot .n { font-weight: 700; font-size: 16.5px; }
.pot .u { font-size: 15px; color: var(--spento); }
.pot.io .u { color: var(--testo); }
.c0 { color: #f08a80; } .c1 { color: #8fa8ff; } .c2 { color: #9fd0f5; } .c3 { color: #d8d8d8; } .c4 { color: #8fe08f; } .c5 { color: #ffffff; } .c6 { color: #f5d060; }
.ris { font-size: 15.5px; } .ris.ko { color: var(--cera-l); }
#velo { position: fixed; inset: 0; background: #000a; display: none; z-index: 5; }
#scheda {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 600px; margin: 0 auto; max-height: 88%; overflow-y: auto;
  background: var(--pannello); border: 1px solid var(--ottone); border-bottom: 0; border-radius: 12px 12px 0 0;
  padding: 14px 12px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px;
}
#brindisi {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(74px + env(safe-area-inset-top)); z-index: 9; display: none;
  background: #2b1d12; color: var(--ottone-l); border: 1px solid var(--ottone); border-radius: 20px; padding: 8px 16px; font-style: italic;
  max-width: 90%; text-align: center; box-shadow: 0 2px 10px #000c;
}
input, select, textarea {
  font: inherit; font-size: 18px; width: 100%; background: #120c08; color: var(--testo); border: 1.5px solid var(--ottone);
  border-radius: 6px; padding: 12px; min-height: 54px;
}
textarea { min-height: 120px; resize: none; }
.titolo { font-family: "Pinyon", "Old Standard", serif; font-size: 64px; color: var(--ottone-l); text-align: center; line-height: 1; margin: 6px 0 0; font-weight: 400; }
.motto { text-align: center; font-style: italic; color: var(--carta); margin-bottom: 6px; }
</style>
</head>
<body>
<div id="app">
  <div id="testa" class="pannello"></div>
  <div id="schede"></div>
  <div id="corpo" class="pannello"></div>
  <div id="piede"></div>
</div>
<div id="velo"><div id="scheda"></div></div>
<div id="brindisi"></div>
<script>
"use strict";
// Configurazione pubblica del progetto Firebase del gioco (la stessa di scripts/net/net.gd).
const CHIAVE = "AIzaSyCf1NQodB-J3OrdU_gHYQ1I6VJtXBk1ciU";
let DB = "https://flammerouge-f8669-default-rtdb.europe-west1.firebasedatabase.app";
let URL_ACCESSO = "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + CHIAVE;
let URL_RINNOVO = "https://securetoken.googleapis.com/v1/token?key=" + CHIAVE;
const RADICE = "diplomacy/rooms";
const parametri = new URLSearchParams(location.search);
// per le prove in locale si può puntare a un finto Firebase: ?rtdb=http://127.0.0.1:8765/db
if (["127.0.0.1", "localhost"].includes(location.hostname) && parametri.get("rtdb")) {
  DB = parametri.get("rtdb");
  const b = DB.replace(/\/[^/]*$/, "");
  URL_ACCESSO = b + "/signup";
  URL_RINNOVO = b + "/refresh";
}
const POTENZE = ["Austria-Ungheria", "Inghilterra", "Francia", "Germania", "Italia", "Russia", "Turchia"];

const S = {
  codice: "", posto: -1, uid: "", gettone: "", rinnovo: "", ora_gettone: 0, nome: "",
  passo: "avvio",           // avvio | codice | entra | attesa | gioco | errore
  scheda: "dip", con: -1, pub: null, priv: null, nomi: null, vpriv: null,
  stanza: null, errore: "", seq: -1, coda: [], bozza: {}, chiave: "", letti: {}, in_viaggio: 0, inviati: "",
  rete: true, primo: true, n_posta: -1
};

// ---------------------------------------------------------------- attrezzi
function el(tag, attr, figli) {
  const e = document.createElement(tag);
  if (attr) for (const k in attr) {
    if (k === "onclick") e.addEventListener("click", attr[k]);
    else if (k === "testo") e.textContent = attr[k];
    else if (attr[k] !== null && attr[k] !== undefined && attr[k] !== false) e.setAttribute(k, attr[k]);
  }
  for (const f of [].concat(figli || [])) if (f) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f);
  return e;
}
const $ = (id) => document.getElementById(id);
function bandiera(p) { return el("img", { src: "b" + p + ".png", alt: "" }); }
function pulsante(testo, fn, classe) { return el("button", { class: classe || "", onclick: fn, testo: testo }); }
function memoria(k, v) {
  try {
    if (v === undefined) return JSON.parse(localStorage.getItem("dp_tel_" + k) || "null");
    localStorage.setItem("dp_tel_" + k, JSON.stringify(v));
  } catch (e) { /* navigazione privata: si va avanti senza memoria */ }
  return null;
}
let _tb = 0;
function brindisi(t) {
  const b = $("brindisi");
  b.textContent = t; b.style.display = "block";
  clearTimeout(_tb); _tb = setTimeout(() => { b.style.display = "none"; }, 3200);
}
function vibra(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* non tutti i telefoni */ } }
const dormi = (ms) => new Promise((r) => setTimeout(r, ms));

// ---------------------------------------------------------------- rete
async function richiesta(metodo, url, corpo, modulo) {
  try {
    const r = await fetch(url, { method: metodo, headers: { "Content-Type": modulo ? "application/x-www-form-urlencoded" : "application/json" },
      body: corpo === undefined ? undefined : (modulo ? corpo : JSON.stringify(corpo)), cache: "no-store" });
    let dati = null;
    try { dati = await r.json(); } catch (e) { dati = null; }
    return { codice: r.status, dati: dati };
  } catch (e) {
    return { codice: 0, dati: null };
  }
}
async function accesso() {
  const m = memoria("accesso");
  if (m && m.rinnovo && m.uid) {
    const r = await richiesta("POST", URL_RINNOVO, "grant_type=refresh_token&refresh_token=" + encodeURIComponent(m.rinnovo), true);
    if (r.codice === 200 && r.dati && r.dati.id_token) {
      S.uid = m.uid; S.gettone = r.dati.id_token; S.rinnovo = r.dati.refresh_token || m.rinnovo; S.ora_gettone = Date.now();
      memoria("accesso", { uid: S.uid, rinnovo: S.rinnovo });
      return true;
    }
    if (r.codice === 0) return false;
  }
  const r = await richiesta("POST", URL_ACCESSO, { returnSecureToken: true });
  if (r.codice !== 200 || !r.dati || !r.dati.idToken) return false;
  S.uid = r.dati.localId; S.gettone = r.dati.idToken; S.rinnovo = r.dati.refreshToken; S.ora_gettone = Date.now();
  memoria("accesso", { uid: S.uid, rinnovo: S.rinnovo });
  return true;
}
async function fresco() {
  if (Date.now() - S.ora_gettone < 50 * 60 * 1000) return;
  const r = await richiesta("POST", URL_RINNOVO, "grant_type=refresh_token&refresh_token=" + encodeURIComponent(S.rinnovo), true);
  if (r.codice === 200 && r.dati && r.dati.id_token) {
    S.gettone = r.dati.id_token; S.rinnovo = r.dati.refresh_token || S.rinnovo; S.ora_gettone = Date.now();
    memoria("accesso", { uid: S.uid, rinnovo: S.rinnovo });
  }
}
function indirizzo(percorso) { return DB + "/" + RADICE + "/" + S.codice + (percorso ? "/" + percorso : "") + ".json?auth=" + encodeURIComponent(S.gettone); }
async function leggi(percorso) { await fresco(); return richiesta("GET", indirizzo(percorso)); }
async function scrivi(percorso, v) { await fresco(); return richiesta("PUT", indirizzo(percorso), v); }
async function ritocca(percorso, v) { await fresco(); return richiesta("PATCH", indirizzo(percorso), v); }
function elenco(v) {           // Firebase rende gli elenchi come array con buchi oppure come oggetti
  const o = {};
  if (Array.isArray(v)) v.forEach((x, i) => { if (x !== null && x !== undefined) o[i] = x; });
  else if (v && typeof v === "object") Object.assign(o, v);
  return o;
}

// ---------------------------------------------------------------- ingresso
async function avvio() {
  const c = (parametri.get("stanza") || "").trim().toUpperCase();
  S.nome = memoria("nome") || "";
  if (!/^[A-Z]{4}$/.test(c)) { S.passo = "codice"; disegna(); return; }
  S.codice = c;
  S.letti = memoria("letti_" + c) || {};
  S.passo = "avvio"; disegna();
  if (!(await accesso())) { S.passo = "errore"; S.errore = "Non riesco a collegarmi. Controllate la rete e riprovate."; disegna(); return; }
  await cerca_stanza();
}
async function cerca_stanza() {
  const [st, se, ap] = await Promise.all([leggi("status"), leggi("seats"), leggi("open")]);
  if (st.codice !== 200 || st.dati === null) {
    S.passo = "errore";
    S.errore = st.codice === 0 ? "La rete non risponde. Riprovate fra un momento." : "La stanza " + S.codice + " non esiste più.";
    disegna(); return;
  }
  S.stanza = { stato: st.dati, posti: elenco(se.dati), aperti: Object.values(elenco(ap.dati)).map(Number) };
  for (const k in S.stanza.posti) if (S.stanza.posti[k] && S.stanza.posti[k].uid === S.uid) { S.posto = Number(k); return dentro(); }
  S.passo = "entra"; disegna();
}
async function prendi(p) {
  const campo = $("nome");
  S.nome = (campo ? campo.value : S.nome).trim().slice(0, 20) || "Giocatore";
  memoria("nome", S.nome);
  S.passo = "avvio"; disegna();
  if (p < 0) {
    // partita già iniziata: si riprende un posto lasciato, con lo stesso nome di prima
    for (const k in S.stanza.posti) {
      const s = S.stanza.posti[k];
      if (s && s.away && String(s.name || "").trim().toLowerCase() === S.nome.toLowerCase()) { p = Number(k); break; }
    }
    if (p < 0) { S.passo = "errore"; S.errore = "Non trovo un posto lasciato libero con questo nome."; disegna(); return; }
  }
  const r = await scrivi("seats/" + p, { uid: S.uid, name: S.nome, tel: true });
  const v = await leggi("seats/" + p);
  if (r.codice !== 200 || !v.dati || v.dati.uid !== S.uid) {
    S.passo = "errore"; S.errore = "Quel posto è stato appena preso da qualcun altro."; disegna(); return;
  }
  S.posto = p;
  dentro();
}
function dentro() {
  // chi era entrato con il gioco intero e ora usa il telefono: lo si segnala a chi ospita
  ritocca("seats/" + S.posto, { tel: true, away: false, seen: { ".sv": "timestamp" } });
  S.passo = S.stanza.stato === "playing" ? "gioco" : "attesa";
  disegna();
  ciclo();
  presenza();
}
async function presenza() {
  for (;;) {
    await dormi(8000);
    ritocca("seats/" + S.posto, { seen: { ".sv": "timestamp" }, away: false });
  }
}

// ---------------------------------------------------------------- ciclo di gioco
async function ciclo() {
  for (;;) {
    try {
      if (S.passo === "attesa") {
        const [st, se, ap] = await Promise.all([leggi("status"), leggi("seats"), leggi("open")]);
        if (st.codice === 200) {
          S.rete = true;
          S.stanza = { stato: st.dati, posti: elenco(se.dati), aperti: Object.values(elenco(ap.dati)).map(Number) };
          if (st.dati === "playing") S.passo = "gioco";
          disegna();
        } else S.rete = false;
      } else if (S.passo === "gioco") {
        await aggiorna();
        await spedisci_coda();
      }
    } catch (e) { console.log("ciclo: " + e); }
    await dormi(S.passo === "gioco" ? 1300 : 1600);
  }
}
async function aggiorna() {
  const r = await leggi("labels/tel/pub");
  if (r.codice !== 200) { if (S.rete) { S.rete = false; piede(); } return; }
  S.rete = true;
  if (typeof r.dati !== "string") { piede(); return; }
  const pub = JSON.parse(r.dati);
  let cambiato = !S.pub || JSON.stringify(pub) !== JSON.stringify(S.pub);
  const fase_nuova = S.pub && pub.chiave !== S.pub.chiave;
  S.pub = pub;
  if (S.seq < 0) S.seq = Number((pub.visti || {})[S.posto] || 0);
  if (!S.nomi) { const n = await leggi("labels/tel/nomi"); if (typeof n.dati === "string") S.nomi = JSON.parse(n.dati); }
  const vp = (pub.vp || {})[S.posto];
  if (vp !== undefined && vp !== S.vpriv) {
    const p = await leggi("labels/tel/p" + S.posto);
    if (typeof p.dati === "string") {
      S.priv = JSON.parse(p.dati); S.vpriv = vp; cambiato = true;
      const n = S.priv.posta.filter((m) => !m.mia).length;
      if (S.n_posta >= 0 && n > S.n_posta) {
        const u = S.priv.posta.filter((m) => !m.mia).pop();
        vibra(80);
        if (!(S.scheda === "dip" && S.con === u.con)) brindisi("Nuovo dispaccio: " + POTENZE[u.con] + ".");
      }
      S.n_posta = n;
    }
  }
  if (fase_nuova) {
    S.bozza = {}; S.inviati = ""; chiudi_scheda();
    vibra(120);
    if (pub.ultima) { S.scheda = "sit"; brindisi(pub.ultima.t + " risolta: guardate il tabellone."); }
  }
  if (cambiato && !occupato()) disegna(); else piede();
}
function occupato() {
  // non si ridisegna sotto le dita: mentre una scheda è aperta o si sta scrivendo
  const a = document.activeElement;
  return $("velo").style.display === "block" || (a && ["INPUT", "TEXTAREA", "SELECT"].includes(a.tagName));
}
function manda(k, v) { S.coda.push({ k: k, v: v }); spedisci_coda(); }
let _spedendo = false;
async function spedisci_coda() {
  if (_spedendo || S.seq < 0) return;
  _spedendo = true;
  try {
    while (S.coda.length) {
      const r = await scrivi("plans/" + S.seq + "/" + S.posto, S.coda[0]);
      if (r.codice === 200) { S.coda.shift(); S.seq++; }
      else if (r.codice === 401 || r.codice === 403) { S.seq++; }       // numero già usato: si passa al successivo
      else break;                                                        // rete assente: si riprova al prossimo giro
    }
  } finally { _spedendo = false; }
}
function dispaccio(a, tipo, d, altro) {
  const m = Object.assign({ da: S.posto, a: a, tipo: tipo, d: d || {}, v: Math.floor(Math.random() * 12) }, altro || {});
  manda("msg", JSON.stringify(m));
  S.in_viaggio = Date.now();
  chiudi_scheda();
  brindisi("Dispaccio spedito.");
  disegna();
}

// ---------------------------------------------------------------- disegno
function disegna() {
  const testa = $("testa"), corpo = $("corpo"), schede = $("schede");
  const scorri = corpo.scrollTop;
  const stessa = corpo.dataset.vista === vista_attuale();
  testa.replaceChildren(); corpo.replaceChildren(); schede.replaceChildren();
  schede.style.display = "none";
  if (S.passo === "gioco" && S.pub && S.priv) {
    testa.append(bandiera(S.posto), el("div", null, [el("div", { class: "t", testo: POTENZE[S.posto] }),
      el("div", { class: "s", testo: S.pub.finita ? "Partita conclusa" : S.pub.titolo + " - " + S.priv.nc + " centri, " + S.priv.nu + " unità" })]));
    schede.style.display = "flex";
    const nl = da_leggere(-1);
    const defs = [["dip", nl ? "Diplomazia (" + nl + ")" : "Diplomazia"], ["ord", posso_ordinare() ? "Ordini (!)" : "Ordini"], ["sit", "Situazione"]];

function scheda_voto() {
  if (!S.pub.par || S.priv.ho_votato || !S.priv.viva || S.pub.finita || S.bozza.votato) return null;
  const voto = (si) => { S.bozza.votato = 1; manda("par", si ? "1" : "0"); disegna(); };
  return el("div", { class: "foglio" }, [el("div", { class: "h", testo: "PROPOSTA DI PAREGGIO" }),
    el("div", { class: "x", testo: "Si propone di chiudere la partita con un pareggio fra le potenze superstiti. Accettate?" }),
    el("div", { class: "fila" }, [pulsante("Accetto", () => voto(true), "primo"), pulsante("Rifiuto", () => voto(false))])]);
}
function vista_situazione(c) {
  const pub = S.pub;
  if (pub.finita) c.append(el("h2", { testo: "Partita conclusa" }), el("p", { testo: pub.esito }));
  c.append(el("h2", { testo: "Le potenze" }));
  pub.pot.forEach((p, i) => {
    c.append(el("div", { class: "pot" + (i === S.posto ? " io" : "") }, [bandiera(i), el("div", null, [
      el("div", { class: "n c" + i, testo: p.b + " (" + p.chi + ") - " + p.c + " centri" }),
      el("div", { class: "u", testo: p.u || (p.viva ? "Nessuna unità." : "Eliminata.") })])]));
  });
  c.append(el("h3", { testo: "I vostri centri" }), el("p", { class: "ris", testo: (S.priv.centri || "Nessuno") + ". Ne servono " + pub.vittoria + " per vincere." }));
  if (pub.ultima) {
    c.append(el("h3", { testo: "Ultima fase: " + pub.ultima.t }));
    let ultimo = -2;
    for (const r of pub.ultima.r) {
      if (r[0] >= 0 && r[0] !== ultimo) c.append(el("div", { class: "pot" }, [el("div", { class: "n c" + r[0], testo: POTENZE[r[0]] })]));
      ultimo = r[0];
      c.append(el("p", { class: "ris" + (r[2] ? " ko" : ""), testo: r[1] + (r[2] ? "  (" + r[2] + ")" : "") }));
    }
  }
  if (!pub.finita && S.priv.viva && !pub.par) c.append(pulsante("Proponi il pareggio", () => { S.bozza.votato = 1; manda("par", "p"); brindisi("Proposta di pareggio inviata."); }));
  c.append(el("p", { class: "nota", testo: "Stanza " + S.codice + ". Se chiudete la pagina, riapritela (o inquadrate di nuovo il codice QR) per rientrare." }));
}

$("velo").addEventListener("click", (e) => { if (e.target === $("velo")) chiudi(); });
document.addEventListener("focusout", () => setTimeout(() => { if (S.passo === "gioco" && !occupato()) disegna(); }, 200));
avvio();
</script>
</body>
</html>
